name: API Tests

on:
  push:
    branches:
      - 'master'
    paths:
      - 'apps/api/**'
  pull_request:
    branches:
      - 'master'
    paths:
      - 'apps/api/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lima_limpia_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lima_limpia_test
      BETTER_AUTH_SECRET: test-secret
      RESEND_API_KEY: test-key

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v7

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile --filter @lima-garbage/api --filter @lima-garbage/database

      - name: apply database migrations
        working-directory: packages/database
        run: bun run db:migrate

      - run: bun run test
