name: API Tests

# An allowlist of apps/api/** missed the things apps/api is built from: the
# workspace packages it imports, and bun.lock, which decides the versions it
# resolves. Ignoring the two leaf apps instead fails safe - anything new runs
# these tests until someone says otherwise.
on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - 'apps/citizen/**'
      - 'apps/web/**'
      - 'datasets/**'
      - '**.md'
  pull_request:
    branches:
      - 'master'
    paths-ignore:
      - 'apps/citizen/**'
      - 'apps/web/**'
      - 'datasets/**'
      - '**.md'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lima_limpia_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lima_limpia_test
      BETTER_AUTH_SECRET: test-secret
      RESEND_API_KEY: test-key

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v7

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --filter @lima-garbage/api --filter @lima-garbage/database

      - name: apply database migrations
        working-directory: packages/database
        run: bun run db:migrate

      - run: bun run test
