name: API Tests

# An allowlist of apps/api/** missed the things apps/api is built from: the
# workspace packages it imports, and bun.lock, which decides the versions it
# resolves. Ignoring the two leaf apps instead fails safe - anything new runs
# these tests until someone says otherwise.
on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - 'apps/citizen/**'
      - 'apps/web/**'
      - 'datasets/**'
      - '**.md'
  pull_request:
    branches:
      - 'master'
    paths-ignore:
      - 'apps/citizen/**'
      - 'apps/web/**'
      - 'datasets/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v7

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --filter @lima-garbage/api --filter @lima-garbage/database

      - run: bun run test

      - name: run database package tests
        working-directory: packages/database
        run: bun run test
