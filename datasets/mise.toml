[settings]
python.uv_venv_auto = "create|source"

[tools]
uv = "0.13.0"
ruff = "0.17.0"

[tasks.install]
description = "Install dependencies"
alias = "i"
run = "uv sync"

[tasks.update]
description = "Update all dependencies"
alias = "u"
run = "uv sync -U"

[tasks.outdated]
description = "List outdated dependencies"
alias = "o"
run = "uv pip list --outdated"

[tasks.export-deps]
description = "Export dependencies to requirements.txt"
alias = "ed"
run = "uv export --format requirements-txt --no-hashes --no-header --no-dev --no-annotate --output-file requirements.txt"

[tasks.fix]
description = "Lint & format (fix by default)"
alias = "f"
run = ["uv run ruff format .", "uv run ruff check --fix --unsafe-fixes ."]

[tasks.dev]
description = "Run development server for a notebook"
alias = "d"
run = "uv run marimo edit"

[tasks.dev-lan]
description = "Run development server for a notebook (LAN)"
alias = "dl"
run = "uv run marimo edit --host 0.0.0.0"

[tasks.export]
description = "Export Marimo notebooks"
alias = "e"
run = "uv run marimo export html-wasm src/03-population-map.py -o src/output --mode run"
